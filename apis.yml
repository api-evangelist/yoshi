aid: yoshi
name: Yoshi
description: 'Yoshi Mobility is a mobile vehicle-care and fleet-services platform founded
  in 2015 (Y Combinator S16). It brings automotive services to the vehicle wherever it is
  parked: mobile maintenance and oil changes, car washes and detailing, tire and battery
  service, EV charging, and live-video vehicle inspections that produce API-ready, signed
  results for fleets and rideshare platforms. Yoshi originally pioneered on-demand fuel
  delivery (that division was acquired by EZFill Holdings in January 2025) and now
  concentrates on mobile auto care and inspection technology, backed by strategic investors
  including General Motors Ventures, Bridgestone, and ExxonMobil. Integrations and APIs are
  offered to partners through direct sales rather than a public self-service developer
  portal.'
